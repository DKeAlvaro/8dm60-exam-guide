site_name: 8DM60 · Exam guide
site_description: "A short, plain-language guide to 8DM60 Multimodal AI in Biomedicine: six topics, the cram sheet, and worked past exercises."
site_url: https://dkealvaro.github.io/8dm60-exam-guide/
use_directory_urls: false
repo_url: https://github.com/DKeAlvaro/8dm60-exam-guide
repo_name: 8dm60-exam-guide

theme:
  name: material
  language: en
  font:
    text: Source Serif 4
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    logo: material/school
    repo: fontawesome/brands/github
  features:
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.expand
    - toc.follow
    - content.tooltips

plugins:
  - search

nav:
  - Start here: index.md
  - Cram sheet · 30 min: cram.md
  - Multiple choice · answer key: mc-answer-key.md
  - Past exercises · worked answers: past-exercises.md
  - Key figures: key-figures.md
  - Clinical workflow cases: workflow-cases.md
  - 1 · Language models: language.md
  - 2 · Vision models: vision.md
  - 3 · Omics models: omics.md
  - 4 · Models for hospital data: hospital.md
  - 5 · Clinical workflow integration: workflow.md
  - 6 · Agentic AI: agents.md
  - Your project · 15%: project.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr
  - toc:
      permalink: "#"
      toc_depth: 2
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.smartsymbols:
      copyright: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0.16.11/dist/katex.min.css
  - https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap
  - stylesheets/extra.css

extra:
  generator: false
